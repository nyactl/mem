version: 2
updates:
  # Base images are pinned by digest in the Dockerfile; this keeps them fresh.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The build stage deliberately tracks the Node LTS line. Digest and minor
      # updates still land; moving to the next major is a decision, not a bump.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
