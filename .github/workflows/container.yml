name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing.
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mem:ci
          build-args: VERSION=${{ steps.meta.outputs.version }}

      # Runs the server the way a deployment does -- notes on a bind mount --
      # and exercises auth, a write, and the git commit that follows every
      # write. That commit is what breaks if git is missing from the image or
      # the runtime user cannot write the data directory.
      - name: Smoke test
        run: |
          docker run --rm mem:ci --version
          docker run --rm --entrypoint id mem:ci | grep -q 'uid=1000(mem)'
          # Owned by the image's uid, as on a real host; git inside the
          # container refuses a repository owned by anyone else.
          notes=$(mktemp -d) && sudo chown 1000:1000 "$notes"
          docker run -d --name mem -p 4747:4747 -e MEM_AUTH_TOKEN=ci-token \
            -v "$notes:/data/notes" mem:ci
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:4747/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4747/api/notes)" = 401
          curl -fsS -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            -d '{"title":"smoke test","body":"hello #ci","tags":[],"sources":[]}' \
            http://127.0.0.1:4747/api/notes
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:4747/api/notes | grep -q smoke-test
          for i in $(seq 10); do
            sudo git -c safe.directory='*' -C "$notes" log --oneline 2>/dev/null | grep -q . && break
            sleep 1
          done
          sudo git -c safe.directory='*' -C "$notes" log --oneline | grep -q .

      - name: Smoke test logs
        if: failure()
        run: docker logs mem

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      # Keyless: the signing identity is this workflow, so a deployment can
      # verify the image came from this repository and there is no key to leak.
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
