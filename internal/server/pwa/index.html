<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>mem</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #7d8590;
      --accent:  #3fb950;
      --danger:  #f85149;
      --amber:   #d29922;
      --radius:  8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-title {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .topbar-logo {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .btn-icon {
      background: none;
      border: none;
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius);
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-icon:active { background: var(--border); }
    .btn-text {
      background: none;
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: var(--radius);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-text:active { opacity: 0.7; }
    .btn-primary {
      background: var(--accent);
      border: none;
      color: #0d1117;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 18px;
      border-radius: var(--radius);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { opacity: 0.8; }

    /* ── scroll area ── */
    .scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--safe-bot) + 16px);
    }

    /* ── status bar ── */
    .status {
      flex-shrink: 0;
      padding: 6px 16px calc(var(--safe-bot) + 6px);
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .status-dot.offline { background: var(--amber); }
    .status-dot.pending { background: var(--amber); }

    /* ── list view ── */
    .search-wrap {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      padding: 8px 12px;
      border-radius: var(--radius);
      outline: none;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }

    .note-list { list-style: none; }
    .note-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .note-item:active { background: var(--surface); }
    .note-item-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }
    .note-item-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag {
      background: rgba(63,185,80,0.12);
      color: var(--accent);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .pending-badge {
      font-size: 10px;
      color: var(--amber);
      margin-left: auto;
    }
    .empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── capture / edit view ── */
    .capture-form {
      display: flex;
      flex-direction: column;
      gap: 0;
      height: 100%;
    }
    .field-title {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .input-title {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 17px;
      font-weight: 500;
      outline: none;
    }
    .input-title::placeholder { color: var(--muted); }
    .field-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .textarea-body {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      padding: 16px;
      outline: none;
      resize: none;
      font-family: inherit;
      min-height: 200px;
    }
    .textarea-body::placeholder { color: var(--muted); }
    .capture-hints {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .save-bar {
      padding: 12px 16px calc(var(--safe-bot) + 12px);
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .save-status {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
    }

    /* ── note view ── */
    .note-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }
    .note-view-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .note-view-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .note-body {
      padding: 20px 16px;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── hidden ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
